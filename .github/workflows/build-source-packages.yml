name: Build Ubuntu packages

on:
  push:
    branches:
      - stable-noble
      - stable-resolute
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.ref_name }} packages
    if: github.ref_name == 'stable-noble' || github.ref_name == 'stable-resolute'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Install source packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            debhelper-compat \
            devscripts \
            fakeroot \
            libexpat-dev \
            libgd-dev \
            libgeoip-dev \
            libpcre2-dev \
            libperl-dev \
            libssl-dev \
            libxslt1-dev \
            po-debconf \
            zlib1g-dev

      - name: Build source package
        run: |
          test "$(dpkg --print-architecture)" = amd64
          source_dir="$(find . -mindepth 3 -maxdepth 3 -type f -path '*/debian/changelog' -print -quit | cut -d/ -f2)"
          test -n "$source_dir"
          cd "$source_dir"
          debuild -S -us -uc

      - name: Upload source package
        uses: actions/upload-artifact@v7
        with:
          name: nginx-source-${{ github.ref_name == 'stable-noble' && 'noble' || 'resolute' }}-amd64
          if-no-files-found: error
          path: |
            nginx_*.dsc
            nginx_*.debian.tar.*
            nginx_*.orig.tar.*
            nginx_*_source.changes
            nginx_*_source.buildinfo

      - name: Build binary packages
        run: |
          source_dir="$(find . -mindepth 3 -maxdepth 3 -type f -path '*/debian/changelog' -print -quit | cut -d/ -f2)"
          test -n "$source_dir"
          cd "$source_dir"
          debuild -b -us -uc

      - name: Upload binary packages
        uses: actions/upload-artifact@v7
        with:
          name: nginx-binary-${{ github.ref_name == 'stable-noble' && 'noble' || 'resolute' }}-amd64
          if-no-files-found: error
          path: |
            nginx*.deb
            libnginx*.deb
            nginx_*_amd64.changes
            nginx_*_amd64.buildinfo
